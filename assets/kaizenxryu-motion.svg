<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Rahul Chamoli | KaizenxRyu</title>
  <desc id="desc">AI engineering, AI security and product development. Gold circuit paths connect a central KR monogram with cloud, code and security symbols. A brief welcome animation settles into a still illustration.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#0b1729"/><stop offset="1" stop-color="#14263c"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d8b77d" stroke-opacity=".045"/></pattern>
  </defs>
  <style>
    .ring{transform-origin:936px 180px;animation:orbit 4.8s ease-out both}
    .signal{stroke-dasharray:12 18;animation:flow 4.8s linear both}
    .reveal{animation:reveal 1.4s ease-out both}
    @keyframes orbit{from{transform:rotate(-65deg)}to{transform:rotate(0)}}
    @keyframes flow{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
    @keyframes reveal{from{opacity:.35}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){.ring,.signal,.reveal{animation:none}}
  </style>
  <rect width="1200" height="360" rx="12" fill="url(#surface)"/>
  <rect width="1200" height="360" rx="12" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="358" rx="11" fill="none" stroke="#d8b77d" stroke-opacity=".28"/>
  <path d="M52 62h44M52 62v30M1148 298h-44M1148 298v-30" fill="none" stroke="#d8b77d" stroke-width="2"/>
  <g class="reveal" font-family="Segoe UI,Arial,sans-serif">
    <text x="70" y="95" fill="#aebcca" font-size="15" letter-spacing="4">RAHUL CHAMOLI</text>
    <text x="66" y="186" fill="#f4f2eb" font-size="76" font-family="Georgia,serif" letter-spacing="-2">Kaizen<tspan fill="#d8b77d" font-style="italic">x</tspan>Ryu</text>
    <text x="70" y="232" fill="#d8b77d" font-size="16" letter-spacing="1">AI ENGINEERING / AI SECURITY / PRODUCT DEVELOPMENT</text>
    <path d="M70 255h480" stroke="#d8b77d" stroke-opacity=".24"/>
    <text x="70" y="284" fill="#aebcca" font-size="13" letter-spacing="2">AZURE · PYTHON · FASTAPI · MICROSOFT 365</text>
  </g>
  <g fill="none" stroke="#d8b77d">
    <circle cx="936" cy="180" r="126" stroke-opacity=".16"/>
    <circle class="ring" cx="936" cy="180" r="107" stroke-dasharray="60 22 2 22" stroke-opacity=".5"/>
    <circle cx="936" cy="180" r="65" stroke-opacity=".7"/>
    <path d="M865 180h-85v-64h-38M1007 180h73v-64h27M936 245v51h-120" stroke-opacity=".25"/>
    <path class="signal" d="M742 116h38v64h85M1007 180h73v-64h27M936 245v51H816" stroke-opacity=".85"/>
    <g stroke-width="1.6">
      <rect x="695" y="89" width="48" height="46" rx="8" fill="#102139"/><path d="M706 119a6 6 0 0 1-1-12 10 10 0 0 1 19-1 7 7 0 0 1 3 13h-21Z"/>
      <rect x="1085" y="89" width="48" height="46" rx="8" fill="#102139"/><path d="m1101 106-6 6 6 6m16-12 6 6-6 6m-7-15-5 18"/>
      <rect x="768" y="273" width="48" height="46" rx="8" fill="#102139"/><path d="m792 282 12 5v9c0 8-12 14-12 14s-12-6-12-14v-9Zm-5 13 4 4 7-8"/>
    </g>
    <circle cx="936" cy="54" r="4" fill="#d8b77d"/>
    <circle cx="1062" cy="180" r="3" fill="#d8b77d"/>
    <circle cx="936" cy="306" r="3" fill="#d8b77d"/>
  </g>
  <text x="936" y="195" text-anchor="middle" font-family="Georgia,serif" font-size="43" fill="#d8b77d" letter-spacing="-5">KR</text>
  <text x="936" y="343" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#aebcca" letter-spacing="2">CONTINUOUS IMPROVEMENT</text>
</svg>
